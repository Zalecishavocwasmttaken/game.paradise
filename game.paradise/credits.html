<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Credits | Game Paradise</title>
  <link rel="stylesheet" href="style.css">
  <style>
    html, body { min-height: 100%; }
    body { min-height: 100vh; overflow-x: hidden; }
    .credits-main { max-width: 760px; margin: 0 auto; padding: 48px 24px; }
    .credits-card {
      padding: 32px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
    }
    .credits-card h1 { margin: 0 0 20px; color: var(--accent); }
    .credits-list { display: grid; gap: 12px; }
    .credits-list p { margin: 0; padding: 12px 14px; background: rgba(255,255,255,.03); border-radius: 8px; line-height: 1.5; }
    .credits-list strong { color: var(--accent); }
    @media (max-width: 600px) {
      .credits-main { padding: 28px 14px; }
      .credits-card { padding: 24px 18px; }
    }
  </style>
</head>
<body>
  <header class="app-bar">
    <nav class="nav" aria-label="Main navigation">
      <a href="homepage.html">Home</a>
      <a href="games.html">Games</a>
      <a href="hub.html">Hub</a>
      <a href="settings.html">Settings</a>
      <a href="proxy.html">Duckduckgo</a>
      <a href="chat.html">Chat</a>
      <a href="media.html">Media</a>
      <a href="share.html">Share</a>
      <a href="credits.html" class="active" aria-current="page">Credits</a>
    </nav>
  </header>
  <main class="credits-main">
    <section class="credits-card">
      <h1>Credits</h1>
      <div class="credits-list">
        <p><strong>Creator:</strong>Quaix_</p>
        <p><strong>Additional credit:</strong> Joshua</p>
        <p><strong>Games:</strong> People who have contributed games like hundreds</p>
        <p><strong>Media:</strong> ambr0sial/nova</p>
        <p><strong>Inspiration:</strong> vapor.my and other gaming sites</p>
      </div>
    </section>
  </main>
</body>
</html>
