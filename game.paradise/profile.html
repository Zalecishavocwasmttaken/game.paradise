<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile | Game Paradise</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { background: #0f0f12; color: white; font-family: sans-serif; margin: 0; }
    
    /* Top Bar */
    .top-nav {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 15px 25px;
        background: #1a1a20;
    }
    .gear-icon {
        width: 28px; height: 28px;
        cursor: pointer;
        transition: transform 0.4s ease;
        filter: invert(1); /* Makes a black icon white */
    }
    .gear-icon:hover { transform: rotate(90deg); }

    .profile-card {
        max-width: 450px;
        margin: 40px auto;
        background: #1a1a20;
        padding: 30px;
        border-radius: 20px;
        text-align: center;
        border: 1px solid #333;
    }

    /* Profile Image with Dark Hover */
    .pfp-container {
        position: relative;
        width: 120px; height: 120px;
        margin: 0 auto 15px;
        cursor: pointer;
        border-radius: 50%;
        overflow: hidden;
    }
    .pfp-main {
        width: 100%; height: 100%;
        object-fit: cover;
        border: 3px solid #00d4ff;
        transition: 0.3s;
    }
    .pfp-overlay {
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        background: rgba(0,0,0,0.7); /* Darkens 20-30% */
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        font-weight: bold;
        color: white;
        opacity: 0;
        transition: 0.3s;
    }
    .pfp-container:hover .pfp-overlay { opacity: 1; }

    .input-group { text-align: left; margin-top: 20px; }
    label { font-size: 11px; color: #888; text-transform: uppercase; }
    
    select, textarea {
        width: 100%; background: #0b0b0e; color: white; border: 1px solid #333;
        padding: 12px; border-radius: 8px; margin: 8px 0 15px 0; font-family: inherit;
    }
    
    .save-btn {
        background: #00d4ff; color: black; border: none; width: 100%;
        padding: 14px; border-radius: 8px; font-weight: bold; cursor: pointer;
    }
  </style>
</head>
<body>

<div class="top-nav">
    <a href="homepage.html" style="color: #888; text-decoration: none;">← Home</a>
    <a href="share.html" style="color: #888; text-decoration: none;">Share</a>
    <a href="credits.html" style="color: #888; text-decoration: none;">Credits</a>
    <a href="settings.html">
        <img src="https://img.icons8.com/ios-filled/50/000000/settings.png" class="gear-icon" alt="Settings">
    </a>
</div>

<div class="profile-card">
    <div class="pfp-container" onclick="updatePFP()">
        <img id="userImg" class="pfp-main" src="defaultprofile.img">
        <div class="pfp-overlay">UPLOAD IMAGE</div>
    </div>

    <h2 id="userName">Loading...</h2>
    
    <div class="input-group">
        <label>Status Mode</label>
        <select id="statusSelect">
            <option value="auto">🤖 Auto (Smart Detect)</option>
            <option value="active">🟢 Active</option>
            <option value="idle">🟡 Idle</option>
            <option value="inactive">🔴 Inactive</option>
        </select>

        <label>Bio / Description</label>
        <textarea id="bioInput" placeholder="Tell people about yourself..."></textarea>
    </div>

    <button class="save-btn" onclick="saveProfile()">Save Profile</button>
</div>

<script>
const PROFILE_KEY = "gameParadiseProfile";
const DEFAULT_PROFILE = { username: "Guest", photoURL: "", status: "auto", bio: "" };

function loadProfile() {
    try {
        return { ...DEFAULT_PROFILE, ...JSON.parse(localStorage.getItem(PROFILE_KEY) || "{}") };
    } catch (error) {
        console.error("Could not load the local profile.", error);
        return { ...DEFAULT_PROFILE };
    }
}

function saveProfileData(profile) {
    try {
        localStorage.setItem(PROFILE_KEY, JSON.stringify(profile));
        return true;
    } catch (error) {
        console.error("Could not save the local profile.", error);
        alert("Could not save your profile in this browser.");
        return false;
    }
}

const profile = loadProfile();
document.getElementById('userName').textContent = profile.username || "Guest";
document.getElementById('userImg').src = profile.photoURL || 'defaultprofile.img';
document.getElementById('statusSelect').value = profile.status || 'auto';
document.getElementById('bioInput').value = profile.bio || '';

function updatePFP() {
    const url = prompt("Enter the direct link to your image (e.g., from Discord or Imgur):");
    if (url && url.trim() !== "") {
        profile.photoURL = url.trim();
        document.getElementById('userImg').src = profile.photoURL;
        saveProfileData(profile);
    }
}

function saveProfile() {
    profile.status = document.getElementById('statusSelect').value;
    profile.bio = document.getElementById('bioInput').value;
    if (saveProfileData(profile)) alert("Profile saved in this browser.");
}
</script>
</body>
</html>
